[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repofold"
dynamic = ["version"]
description = "Pack a codebase into a single LLM-ready prompt: gitignore-aware, token-counted, secrets redacted."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "claude", "prompt", "context", "codebase", "ai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/keineahnugehm/iloveclaude"
Issues = "https://github.com/keineahnugehm/iloveclaude/issues"

[project.optional-dependencies]
claude = ["anthropic>=0.42"]

[project.scripts]
repofold = "repofold.cli:main"

[tool.setuptools.dynamic]
version = { attr = "repofold.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
